name: ask-repo tests

on:
  push:
    branches: [main]
    paths:
      - plugins/ask-repo/**
      - .github/workflows/ask-repo.yml
  pull_request:
    paths:
      - plugins/ask-repo/**
      - .github/workflows/ask-repo.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: node --test plugins/ask-repo/test/*.test.mjs
        shell: bash
